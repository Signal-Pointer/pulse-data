name: Discovery scan

on:
  schedule:
    - cron: "0 6,14,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: discovery-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run discovery scraper
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python discovery_scraper.py

      - name: Commit resultaten (private repo)
        run: |
          git config user.name "pulse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/applist.json data/discovery_cursor.json data/discovered_games.json
          git diff --staged --quiet || git commit -m "Discovery scan $(date -u +%FT%H:%M)"
          git push

      - name: Publiceer naar publieke data-repo
        env:
          PUBLIC_TOKEN: ${{ secrets.PUBLIC_DATA_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${PUBLIC_TOKEN}@github.com/Signal-Pointer/pulse-data.git public-repo
          cp data/discovered_games.json public-repo/discovered_games.json
          cd public-repo
          git config user.name "pulse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add discovered_games.json
          git diff --staged --quiet || git commit -m "Discovery update $(date -u +%FT%H:%M)"
          git push
