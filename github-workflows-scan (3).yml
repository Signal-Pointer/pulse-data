name: Steam player count scan

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: steam-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper
        run: python steam_scraper.py

      - name: Commit resultaten (private repo)
        run: |
          git config user.name "pulse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Scan $(date -u +%FT%H:%M)"
          git push

      - name: Publiceer naar publieke data-repo
        env:
          PUBLIC_TOKEN: ${{ secrets.PUBLIC_DATA_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${PUBLIC_TOKEN}@github.com/Signal-Pointer/pulse-data.git public-repo
          cp data/history.json public-repo/history.json
          cd public-repo
          git config user.name "pulse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || git commit -m "Update $(date -u +%FT%H:%M)"
          git push
