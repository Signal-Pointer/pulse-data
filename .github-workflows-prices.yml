name: ITAD price scan

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run price scraper
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
        run: python itad_price_scraper.py

      - name: Commit resultaten (private repo)
        run: |
          git config user.name "pulse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet || git commit -m "Price scan $(date -u +%F)"
          git push

      - name: Publiceer naar publieke data-repo
        env:
          PUBLIC_TOKEN: ${{ secrets.PUBLIC_DATA_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${PUBLIC_TOKEN}@github.com/Signal-Pointer/pulse-data.git public-repo
          cp data/prices.json public-repo/prices.json
          cd public-repo
          git config user.name "pulse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "Price update $(date -u +%F)"
          git push
