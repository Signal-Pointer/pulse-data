name: Metadata enrichment

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas pyarrow huggingface_hub

      - name: Run enrichment
        run: python enrich_metadata.py

      - name: Commit resultaten (private repo)
        run: |
          git config user.name "pulse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/metadata.json
          git diff --staged --quiet || git commit -m "Metadata enrichment $(date -u +%F)"
          git push

      - name: Publiceer naar publieke data-repo
        env:
          PUBLIC_TOKEN: ${{ secrets.PUBLIC_DATA_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${PUBLIC_TOKEN}@github.com/Signal-Pointer/pulse-data.git public-repo
          cp data/metadata.json public-repo/metadata.json
          cd public-repo
          git config user.name "pulse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add metadata.json
          git diff --staged --quiet || git commit -m "Metadata update $(date -u +%F)"
          git push
